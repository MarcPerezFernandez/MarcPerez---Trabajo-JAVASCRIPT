<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/style.css">
    <title>Galería de pistas</title>
</head>
<body>
    <header>
        <div class="header-title">
            <img src="Assets/Images/la-sierra.png" alt="La Sierra">
        </div>
        <div class="navbar" id="navbar"></div>
    </header>
    <main>
        <h1 style="text-align: center;">Nuestras pistas</h1>
        <div class="carousel-container">
            <button id="prev-btn" class="prev-btn">&larr;</button>
            <div id="carousel" class="carousel">
                <div class="caja inactiva"></div>
                <div class="caja activa"></div>
                <div class="caja inactiva"></div>
            </div>
            <button id="next-btn" class="next-btn">&rarr;</button>
        </div>
        <div class="dots-container"></div>
    </main>
    <footer>
        <div class="redes" id="redes"></div>
        <div class="copy" id="copy"></div>
    </footer>
    <script src="Js/navbar.js"></script>
    <script src="Js/galeria.js"></script>
    <script src="Js/footer.js"></script>
</body>
</html>
